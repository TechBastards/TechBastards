name: Update LeetCode Stats

on:
  schedule:
    - cron: '0 0 * * *' # Run every day at midnight
  workflow_dispatch: # Allow manual triggering

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Fetch LeetCode Stats
        run: |
          curl -sL "https://leetcard.jacoblin.cool/vinayaksharma14?theme=dark&font=baloo&ext=activity" -o leetcode-stats.svg

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add leetcode-stats.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: Update LeetCode stats card" && git push)
